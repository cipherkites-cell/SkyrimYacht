<title>Yacht Dice Cup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: the table fills the screen; the scorecard is a ledger pinned to the right (a sheet below it on phones). */
:root {
  --soot: #15100c;      /* room behind the table */
  --oak: #2b2017;       /* ledger panel */
  --oak-edge: #4a3726;
  --parchment: #eadcbc; /* text */
  --muted: #a8977c;
  --brass: #caa457;     /* accent */
  --ember: #e48a4c;     /* score previews */
  --display: "IM Fell English SC", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--soot); color: var(--parchment); font-family: var(--body); font-size: 15px;
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
}
.app { position: relative; height: 100%; display: flex; }
.stage { position: relative; flex: 1; min-width: 0; }
canvas#view { display: block; width: 100%; height: 100%; cursor: grab; }
canvas#view.shaking { cursor: grabbing; }
canvas#view.over-die { cursor: pointer; }

.hud {
  position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px;
  display: flex; align-items: center; gap: 14px; pointer-events: none; flex-wrap: wrap;
}
.hud h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; letter-spacing: 0.02em; color: var(--brass); }
.rolls { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.rolls i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--brass); display: inline-block; }
.rolls i.used { background: var(--brass); }
.hud button { pointer-events: auto; }

.hint {
  position: absolute; left: 50%; top: 62px; transform: translateX(-50%); max-width: calc(100% - 32px);
  padding: 8px 16px; border-radius: 999px; background: rgba(21, 16, 12, 0.72); border: 1px solid var(--oak-edge);
  font-size: 15px; text-align: center; pointer-events: none; text-wrap: balance;
}
.toast {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-family: var(--display); font-size: 44px;
  color: var(--brass); text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8); pointer-events: none; opacity: 0; transition: opacity 0.25s, transform 0.6s;
}
.toast.show { opacity: 1; transform: translate(-50%, -70%); }

.icon-btn {
  font: inherit; font-size: 13px; color: var(--parchment); background: rgba(43, 32, 23, 0.85); border: 1px solid var(--oak-edge);
  border-radius: 6px; padding: 5px 10px; cursor: pointer;
}
.icon-btn:hover { border-color: var(--brass); }
.icon-btn:focus-visible, .row:focus-visible, .newgame:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.ledger {
  width: 290px; flex: none; background: var(--oak); border-left: 1px solid var(--oak-edge);
  display: flex; flex-direction: column; padding-block: 14px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
}
.ledger h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--brass); display: flex; justify-content: space-between; align-items: baseline; }
.ledger h2 span { font-family: var(--body); font-size: 26px; font-weight: 700; color: var(--parchment); font-variant-numeric: tabular-nums; }
.section-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px; }
.row {
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%;
  font: inherit; color: var(--parchment); background: none; border: none; border-bottom: 1px dotted var(--oak-edge);
  padding: 5px 4px; text-align: left; cursor: default;
}
.row .val { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 2.5em; text-align: right; }
.row.filled .val { color: var(--parchment); }
.row.filled .name { color: var(--muted); }
.row.open .val { color: var(--ember); font-weight: 500; }
.row.open.zero .val { color: var(--muted); }
.row.pickable { cursor: pointer; }
.row.pickable:hover { background: rgba(202, 164, 87, 0.12); }
.row.locked .val { color: transparent; }
.sub { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 4px 4px 0; font-variant-numeric: tabular-nums; }
.newgame {
  margin-top: 14px; font: inherit; font-weight: 700; color: var(--soot); background: var(--brass); border: none; border-radius: 6px;
  padding: 9px 12px; cursor: pointer;
}
.help { margin-top: auto; padding-top: 14px; font-size: 13px; color: var(--muted); line-height: 1.5; }
.help b { color: var(--parchment); font-weight: 500; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; }

@media (max-width: 760px) {
  .app { flex-direction: column; }
  .stage { flex: 1 1 58%; }
  .ledger { width: auto; flex: 1 1 42%; border-left: none; border-top: 1px solid var(--oak-edge); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .rows { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }
  .section-label { grid-column: 1 / -1; }
  .help { display: none; }
  .hud h1 { font-size: 24px; }
  .hint { font-size: 13px; top: 52px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="view" aria-label="Dice tray. Hold the mouse button or space bar to shake the cup, release to pour."></canvas>
    <div class="hud">
      <h1>Yacht</h1>
      <div class="rolls" id="rolls" aria-live="polite"><span>Roll</span><i></i><i></i><i></i></div>
      <button class="icon-btn" id="sound" type="button" aria-pressed="true">Sound on</button>
    </div>
    <div class="hint" id="hint">Loading…</div>
    <div class="toast" id="toast"></div>
    <div class="loading" id="loading">Setting up the table…</div>
  </div>
  <aside class="ledger" aria-label="Scorecard">
    <h2>Scorecard <span id="total">0</span></h2>
    <div class="rows" id="rows"></div>
    <div class="sub"><span>Upper bonus (35 at 63)</span><span id="upper">0 / 63</span></div>
    <div class="sub"><span>Yacht bonuses</span><span id="ybonus">0</span></div>
    <button class="newgame" id="newgame" type="button" hidden>New game</button>
    <div class="help">
      <b>Hold</b> the mouse button (or space) and move to shake the cup. <b>Let go</b> to tip the dice out.
      <b>Click a die</b> to keep it on the rack between rolls. After up to three rolls, <b>pick a box</b> to score.
    </div>
  </aside>
</div>

    const m = new THREE.Mesh(new THREE.BoxGeometry(w, d, h), mat);

  box(S.X * 2 + wallT * 2, wallT, wallH, 0, -S.Yh - wallT / 2, wallH / 2 - 0.2, woodMat);
  box(wallT, S.Yh * 2, wallH, S.X + wallT / 2, 0, wallH / 2 - 0.2, woodMat);

  const PIPS = {

  const dieGeo = roundedCube(S.die, S.die * S.round);
  const dice = [];
  for (let i = 0; i < 5; i++) {
    const m = new THREE.Mesh(dieGeo, dieMats);

    m.userData.index = i;

  const cupGroup = new THREE.Group();
  {
    const R = S.R, W = S.W, H = S.H;
    const pts = [
      [0.01, 0.0], [R, 0.0], [R, H - 0.1], [R + 0.03, H], [R + W * 0.5, H + 0.12], [R + W + 0.05, H],

  world.add(cupGroup);

  function resize() {

  function scoopIntoCup(mask, animate) {
    const st0 = f64(Y.y_state(), 62);
    const from = [];
    for (let i = 0; i < 5; i++) from.push([st0[i * 11], st0[i * 11 + 1], st0[i * 11 + 2], st0[i * 11 + 7]]);

  // ------------------------------------------------------------------ scorecard UI

  // ------------------------------------------------------------------ input
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

  function setRay(e) {

    const q = Math.PI / 2;

        cup.y = pour.at.y + (REST.y - pour.at.y) * k;
        cup.z = pour.at.z + (REST.z - pour.at.z) * k + Math.sin(k * Math.PI) * 3.5;

      cup.z = REST.z + Math.sin(s * 1.3) * 0.12;
      tmpQ.setFromAxisAngle(tmpV.set(1, 0.4, 0).normalize(), Math.sin(s * 0.9) * 0.03);
      cup.q.copy(tmpQ);
    }
    lastCup = { x: cup.x, y: cup.y };

    const n = Y.y_step(dt, cup.x, cup.y, cup.z, cup.q.w, cup.q.x, cup.q.y, cup.q.z);
    if (n > 0) {
      const ev = f64(Y.y_events(), n * 3);
      for (let i = 0; i < n; i++) {
        const type = ev[i * 3], speed = ev[i * 3 + 2];
        hit(type === 0 ? 0 : type === 1 ? 1 : type === 2 ? 2 : 3, speed);
      }
    }

    if (phase === "rolling") {
      rollingTime += dt;
      if (Y.y_any_in_cup() && rollingTime > 0.5) {
        // A die stayed in the cup: tip it again.
        phase = "shaking"; Y.y_set_lid(1); shakeTime = 0; beginPour();
      } else if (Y.y_all_settled() && rollingTime > 0.25) {
        finishRoll();
      }
    }

    // Draw.
    const st = f64(Y.y_state(), 62);
    for (let i = 0; i < 5; i++) {
      const m = dice[i], o = i * 11;
      let target, targetQ;
      if (held[i]) {
        target = tmpV.set(rackX(rackSlot[i]), rackY, rackTop + half).clone();
        targetQ = faceUpQuat(faces[i], new THREE.Quaternion());
      } else {
        target = new THREE.Vector3(st[o], st[o + 1], st[o + 2]);
        targetQ = new THREE.Quaternion(st[o + 4], st[o + 5], st[o + 6], st[o + 3]);
      }
      const a = anim[i];
      if (a) {
        a.t += dt;
        const k = ease(Math.min(1, a.t / a.dur));
        m.position.copy(a.from).lerp(target, k);
        m.position.z += Math.sin(k * Math.PI) * 1.2;
        if (a.fromQ) m.quaternion.copy(a.fromQ).slerp(targetQ, k); else m.quaternion.copy(targetQ);
        if (a.t >= a.dur) anim[i] = null;
      } else {
        m.position.copy(target);
        m.quaternion.copy(targetQ);
      }
    }
    cupGroup.position.set(cup.x, cup.y, cup.z);
    cupGroup.quaternion.copy(cup.q);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // Hooks for automated checks of the preview.
  window.__yacht = { state: () => Array.from(f64(Y.y_state(), 62)), phase: () => phase, faces: () => faces.slice(), settled: () => Y.y_all_settled(),
    screen: (i) => { const v = dice[i].getWorldPosition(new THREE.Vector3()).project(camera); const r = canvas.getBoundingClientRect();
      return [r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height]; } };
  startTurn();
  $("loading").remove();
  requestAnimationFrame(frame);
})().catch((err) => {
  const l = document.getElementById("loading");
  if (l) l.textContent = "The dice table couldn't start: " + (err && err.message ? err.message : err);
});
</script>
