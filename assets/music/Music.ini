; Skyrim Yacht: the music at the table.
; Each inn has its own two tracks. The name on the left is matched against the room you are in (the name the game
; shows for it, e.g. "The Bannered Mare"), then against the places around it. Anywhere else, the [Winter] tracks play
; in the cold places listed there, and the [Default] tracks everywhere else.
; Add your own: drop .ogg files (44.1 kHz) in this folder and name them here, separated by |. A line for a new inn
; (or a mod-added one) works the same way.

[Inns]
The Bannered Mare = Kings_Feast.ogg | The_Old_Tower_Inn.ogg   ; Whiterun
Sleeping Giant Inn = Traveling_Minstrels.ogg | Pleasant_Creek.ogg   ; Riverwood
The Winking Skeever = Three_Sheets.ogg | Tavern_in_the_Mist.ogg   ; Solitude
The Bee and Barb = Spinning_Tavern.ogg | Harvest_Festival.ogg   ; Riften
The Ragged Flagon = Bandit_Country.ogg | Old_Town.ogg   ; Riften
Silver-Blood Inn = The_Road_Ahead.ogg | Journeys_End.ogg   ; Markarth
Dead Man's Drink = Wanderer.ogg | Harvest_Moon.ogg   ; Falkreath
Moorside Inn = Silvan_Sanctuary.ogg | Waters_Edge.ogg   ; Morthal
Frostfruit Inn = Rejoicing.ogg | Sylvan_Waltz.ogg   ; Rorikstead
Four Shields Tavern = Market_Day.ogg | Town_Theme.ogg   ; Dragon Bridge
Old Hroldan Inn = Settlement_of_the_Frontier.ogg | Love_Theme.ogg   ; Old Hroldan
The Retching Netch = Sunrise.ogg | As_Seasons_Change.ogg   ; Raven Rock
Vilemyr Inn = Mountain_Idyll.ogg | Highland_Mist.ogg   ; Ivarstead
Candlehearth Hall = Legends_of_the_North.ogg | Midwinter.ogg   ; Windhelm
New Gnisis Cornerclub = Night_Town.ogg | Albian_Nocturne.ogg   ; Windhelm
The Frozen Hearth = Ice_Cave.ogg | Northern_Mountains.ogg   ; Winterhold
Windpeak Inn = Solstice_Festival.ogg | Northern_Frontier.ogg   ; Dawnstar
Braidwood Inn = Harsh_Lands.ogg | Expedition.ogg   ; Kynesgrove
Nightgate Inn = Lost_in_the_Fog.ogg | Calm_Before_the_Storm.ogg   ; The Pale
Thirsk Mead Hall = Celtica.ogg | The_Fledgling_Kingdom.ogg   ; Solstheim

[Winter]
Places = Windhelm, Winterhold, Dawnstar, Kynesgrove, Eastmarch, The Pale, Nightgate, Thirsk, Skaal, High Hrothgar, Ivarstead, Snow Veil
Tracks = Midwinter.ogg | Northern_Mountains.ogg | Legends_of_the_North.ogg | Solstice_Festival.ogg | Ice_Cave.ogg | Mountain_Idyll.ogg

[Default]
Tracks = Kings_Feast.ogg | The_Old_Tower_Inn.ogg | Traveling_Minstrels.ogg | Tavern_in_the_Mist.ogg | Woodland_Fantasy.ogg | Treasure_Hunter.ogg | Old_Warhorse.ogg
