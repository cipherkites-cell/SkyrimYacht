; SkyrimYacht settings. Changes take effect the next time the game starts.

[Play]
MinBet = 25            ; the wager range, in septims
MaxBet = 100
TableReach = 180       ; how near a table a seated NPC must be to offer a game (game units; 70 = about a metre)
MouseSpeed = 1.0
UiScale = 1.0
Volume = 1.0           ; dice, cups and the Shout (0 - 2)
PauseGame = 0          ; 1 pauses the world while you play (the item view, Mode 1, always pauses)

[Table]
Mode = 0               ; 0: drawn by the mod over the paused game (as the preview). 1: the game's item view. 2: in the room
Distance = 110         ; Mode 2: how far in front of the camera (game units)
Brightness = 1.0       ; Mode 2: lifts the table out of a dark room (1 = as the room lights it)
TiltDegrees = 52       ; how far you look down on it. If it shows from underneath, set FlipTilt = 1
FitWidth = 0.95        ; how much of the screen the table and both cups take
CenterX = 0.50
CenterY = 0.545
Depth = 0              ; Mode 1: 0 = where the game puts items; larger = further away
FlipTilt = 0

[Debug]
Overlay = 0            ; 1 draws the tray outline and the dice the mouse can hit, to check the table lines up
LogInput = 0
