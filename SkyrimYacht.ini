; SkyrimYacht settings. Changes take effect the next time the game starts.

[Play]
MinBet = 25            ; the wager range, in septims
MaxBet = 100
TableReach = 180       ; how near a table a seated NPC must be to offer a game (game units; 70 = about a metre)
MouseSpeed = 1.0
UiScale = 1.0
DiceSet =              ; test: force a set (bone, iron, steel, corundum, dwemer, orichalcum, silver, quicksilver,
                       ; moonstone, gold, malachite, ebony, stalhrim, dragonbone, daedric). Empty: the sets you've won

[Table]
; How the table sits in the game's 3D item view. If it shows from underneath, set FlipTilt = 1.
TiltDegrees = 55       ; how far you look down on it
FitWidth = 0.80        ; how much of the screen width the table and both cups take
CenterX = 0.50
CenterY = 0.56
Depth = 0              ; 0 = where the game puts items; larger = further away
FlipTilt = 0

[Debug]
Overlay = 0            ; 1 draws the tray outline and the dice the mouse can hit, to check the table lines up
LogInput = 0
